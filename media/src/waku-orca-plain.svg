<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Waku, an orca drawn in a Coast Salish–inspired formline style">
  <defs>
    <clipPath id="body"><use href="#orca-body"/></clipPath>
    <clipPath id="badge"><circle cx="256" cy="256" r="248"/></clipPath>
    <!-- Coast Salish design elements: crescent and trigon -->
    <path id="crescent" d="M-40 0 A40 40 0 0 1 40 0 A54 54 0 0 0 -40 0 Z"/>
    <path id="trigon" d="M-30 -22 Q0 -12 30 -22 Q12 6 0 30 Q-12 6 -30 -22 Z"/>
  </defs>
  <!-- badge: sand, with a teal water crescent -->
  <!-- flukes -->
  <path d="M106 320 C72 286 42 292 18 314 C48 316 68 320 88 324 C68 334 50 348 30 372 C60 362 86 350 108 334 Z" fill="#0b1220"/>
  <use href="#trigon" transform="translate(58 330) rotate(-90) scale(.55)" fill="#efe6d6"/>
  <!-- body -->
  <path id="orca-body" d="M100 312 C160 200 280 150 380 170 C430 180 470 220 462 250 C450 300 380 330 300 336 C220 342 150 340 100 336 Z" fill="#0b1220"/>
  <g clip-path="url(#body)">
    <!-- belly: one long crescent -->
    <path d="M120 330 C220 300 340 296 452 262 C420 316 250 340 120 330 Z" fill="#efe6d6"/>
    <!-- formline: one crescent on the flank, one trigon behind it -->
    <use href="#crescent" transform="translate(250 262) rotate(-18) scale(.8)" fill="#efe6d6"/>
    <use href="#trigon" transform="translate(330 282) rotate(180) scale(.6)" fill="#b3372b"/>
    <!-- eye -->
    <circle cx="392" cy="222" r="20" fill="#efe6d6"/>
    <circle cx="395" cy="222" r="9" fill="#0b1220"/>
    <use href="#trigon" transform="translate(438 268) rotate(150) scale(.5)" fill="#b3372b"/>
    <!-- jaw -->
    <path d="M410 284 Q444 280 460 254" fill="none" stroke="#efe6d6" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- dorsal fin with trigon cut and red crescent -->
  <path d="M256 200 C248 150 238 108 226 72 C272 100 312 138 332 194 Z" fill="#0b1220"/>
  <use href="#crescent" transform="translate(262 142) rotate(72) scale(.5)" fill="#efe6d6"/>
  <use href="#trigon" transform="translate(298 186) rotate(205) scale(.45)" fill="#b3372b"/>
  <!-- pectoral fin with red crescent -->
  <path d="M318 316 C300 342 306 374 338 382 C358 364 354 330 342 310 Z" fill="#0b1220"/>
  <use href="#crescent" transform="translate(334 350) rotate(104) scale(.45)" fill="#efe6d6"/>
</svg>
